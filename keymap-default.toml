[[keys]]
on   = "P"
run  = "paste --force"
desc = "强制粘贴（覆盖同名）"

[[keys]]
on   = "u"
run  = "undo"
desc = "撤回最近一步（Ctrl+Z 同义）"

[[keys]]
on   = "T"
run  = "terminal"
desc = "在终端中打开（光标行，须是文件夹）"

[[keys]]
on   = "o"
run  = "menu"
desc = "打开光标行的菜单（同右键）"

[[keys]]
on   = "L"
run  = "link"
desc = "创建链接（面板：绝对/相对/硬链，再来是路径）"

