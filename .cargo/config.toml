[env]
# crabhop renders PDF pages with a statically linked PDFium. scripts/fetch-pdfium.sh puts the
# library in libs/pdfium (ignored by git); this is where pdfium-render and build.rs look
# for it. The path is relative to this file.
PDFIUM_STATIC_LIB_PATH = { value = "libs/pdfium/lib", relative = true }
